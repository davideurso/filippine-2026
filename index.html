    ['hidden beach','hidden,beach,el,nido'],['big lagoon','big,lagoon,el,nido'],['nacpan','nacpan,beach,el,nido'],['el nido','el,nido,palawan'],
    ['chocolate hills','chocolate,hills,bohol'],['delfini','balicasag,island,bohol'],['panglao','panglao,bohol,beach'],['bohol','bohol,philippines'],
    ['tumalog','tumalog,falls,oslob'],['sumilon','sumilon,island,cebu'],['inambakan','inambakan,falls,cebu'],['oslob','oslob,cebu,whale,shark'],
    ['cambugahay','cambugahay,falls,siquijor'],['snorkeling e spiagge','siquijor,beach,snorkeling'],['siquijor','siquijor,philippines'],
    ['dumaguete','dumaguete,philippines'],['moalboal','moalboal,cebu'],['manila','manila,philippines'],
    ['clark','clark,airport,philippines'],['francisco b. reyes','busuanga,airport,coron'],['panglao international','bohol,panglao,airport'],
    ['el nido airport','el,nido,airport'],['ninoy aquino','manila,airport'],['malpensa','milan,airport'],['indira gandhi','delhi,airport'],
    ['porto coron','coron,port,philippines'],['ferry terminal','el,nido,port'],['port of dumaguete','dumaguete,port']
  ];
  for(const [key,q] of specific){if(n.includes(key))return q;}
  return `${encodeURIComponent(name||'Philippines')},philippines`;
}
function stableLock(name){let h=2166136261;for(const ch of name){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return Math.abs(h>>>0)%100000;}
function photoHtml(name,p){
  if(p && p.category==='hotel') return '';
  const query=photoKeywords(name,p);
  const lock=stableLock(name);
  const primary=`https://loremflickr.com/900/600/${query}?lock=${lock}`;
  const secondary=`https://loremflickr.com/900/600/philippines,travel?lock=${lock+100003}`;
  const sources=[primary,secondary];
  return `<img class="popup-photo" src="${primary}" data-sources='${JSON.stringify(sources)}' data-index="0" alt="${name}" loading="eager"><div class="photo-fallback">Foto non disponibile</div><div class="photo-credit">Foto tematica del luogo: <a href="https://www.flickr.com/search/?text=${encodeURIComponent(name+' Philippines')}" target="_blank" rel="noopener">ricerca Flickr</a></div>`;
}
document.addEventListener('error',e=>{
  const img=e.target;
  if(!img.classList || !img.classList.contains('popup-photo')) return;
  let sources=[];
  try{sources=JSON.parse(img.dataset.sources||'[]')}catch(_){sources=[]}
  const next=Number(img.dataset.index||0)+1;
  if(next<sources.length){img.dataset.index=String(next);img.src=sources[next];return;}
  img.style.display='none';
  const fallback=img.nextElementSibling;
  if(fallback && fallback.classList.contains('photo-fallback')){fallback.style.display='block';fallback.textContent='Foto temporaneamente non disponibile';}
},true);

const PHOTO_REPO={owner:'davideurso',repo:'filippine-2026',branch:'main'};
const PHOTO_ALBUMS={manila:{title:'Manila',path:'foto/manila',description:'Foto personali scattate a Manila'},coron:{title:'Coron',path:'foto/coron',description:'Foto personali scattate a Coron'}};
const albumCache=new Map();
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
function isImageFile(name){return /\.(jpe?g|png|webp|gif|avif)$/i.test(name||'');}
async function loadAlbum(key){
  if(albumCache.has(key)) return albumCache.get(key);
  const album=PHOTO_ALBUMS[key];
  if(!album) throw new Error('Album non trovato');
  const api=`https://api.github.com/repos/${PHOTO_REPO.owner}/${PHOTO_REPO.repo}/contents/${album.path}?ref=${PHOTO_REPO.branch}`;
  const response=await fetch(api,{headers:{Accept:'application/vnd.github+json'}});
  if(!response.ok) throw new Error(`Impossibile caricare le foto (${response.status})`);
  const data=await response.json();
  const files=(Array.isArray(data)?data:[]).filter(item=>item.type==='file'&&isImageFile(item.name)).sort((a,b)=>a.name.localeCompare(b.name,'it',{numeric:true})).map(item=>({name:item.name,url:item.download_url||`https://raw.githubusercontent.com/${PHOTO_REPO.owner}/${PHOTO_REPO.repo}/${PHOTO_REPO.branch}/${album.path}/${encodeURIComponent(item.name)}`}));
  albumCache.set(key,files);
  return files;
}
function albumListHtml(){
  return `<div class="photo-albums">${Object.entries(PHOTO_ALBUMS).map(([key,a])=>`<button class="photo-album-card" type="button" data-open-album="${key}"><span><strong>📍 ${escapeHtml(a.title)}</strong><small>${escapeHtml(a.description)}</small></span><span>›</span></button>`).join('')}</div>`;
}
function showAlbumList(){const host=document.getElementById('photosDrawerBody');host.innerHTML=albumListHtml();}
async function showAlbum(key){
  const host=document.getElementById('photosDrawerBody');
  const album=PHOTO_ALBUMS[key];
  host.innerHTML=`<button class="photo-gallery-back" type="button">← Sezioni</button><h3>${escapeHtml(album.title)}</h3><div class="photo-gallery-status">Caricamento foto…</div>`;
  try{
    const files=await loadAlbum(key);
    host.innerHTML=`<button class="photo-gallery-back" type="button">← Sezioni</button><h3>${escapeHtml(album.title)}</h3>${files.length?`<div class="photo-gallery-grid">${files.map((f,i)=>`<a href="${f.url}" target="_blank" rel="noopener"><img src="${f.url}" alt="${escapeHtml(album.title)} - foto ${i+1}" loading="lazy"></a>`).join('')}</div>`:'<div class="photo-gallery-status">Nessuna foto presente in questa sezione.</div>'}`;
  }catch(err){host.innerHTML=`<button class="photo-gallery-back" type="button">← Sezioni</button><h3>${escapeHtml(album.title)}</h3><div class="photo-gallery-status">${escapeHtml(err.message)}</div>`;}
}
function openPhotosDrawer(key=null){closeDrawers();document.getElementById('photosDrawer').classList.add('open');if(key)showAlbum(key);else showAlbumList();}
async function hydratePersonalPhotos(root=document){
  const blocks=[...root.querySelectorAll('[data-personal-album]')];
  for(const block of blocks){
    if(block.dataset.loaded==='1') continue;
    block.dataset.loaded='1';
    const key=block.dataset.personalAlbum;
    try{
      const files=await loadAlbum(key);
      const preview=files.slice(0,6);
      block.innerHTML=preview.length?`<div class="personal-photo-title">Le nostre foto</div><div class="personal-photo-strip">${preview.map((f,i)=>`<img src="${f.url}" alt="${escapeHtml(PHOTO_ALBUMS[key].title)} - foto ${i+1}" loading="lazy">`).join('')}</div><button class="personal-photo-more" type="button" data-open-album="${key}">Vedi tutte le foto (${files.length})</button>`:'<div class="photo-gallery-status">Nessuna foto disponibile.</div>';
    }catch(err){block.innerHTML='<div class="photo-gallery-status">Foto temporaneamente non disponibili.</div>';}
  }
}

const map=L.map('map',{worldCopyJump:true}).setView([12.3,122.0],6);
const baseLayers={classic:L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20,attribution:'© OpenStreetMap contributors © CARTO'}),satellite:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'})};let activeBaseLayer=baseLayers.classic.addTo(map);function setBaseLayer(style){const next=baseLayers[style]||baseLayers.classic;if(next!==activeBaseLayer){map.removeLayer(activeBaseLayer);next.addTo(map);next.bringToBack();activeBaseLayer=next;}}
const icons={
aeroporto:L.divIcon({className:'',html:'<div class="pin pin-aeroporto">✈️</div>',iconSize:[38,38],iconAnchor:[19,19],popupAnchor:[0,-16]}),
porto:L.divIcon({className:'',html:'<div class="pin pin-porto">⛴️</div>',iconSize:[38,38],iconAnchor:[19,19],popupAnchor:[0,-16]}),
hotel:L.divIcon({className:'',html:'<div class="pin pin-hotel">🏨</div>',iconSize:[38,38],iconAnchor:[19,19],popupAnchor:[0,-16]}),
attrazione:L.divIcon({className:'',html:'<div class="pin pin-attrazione">📍</div>',iconSize:[38,38],iconAnchor:[19,19],popupAnchor:[0,-16]}),
esperienza:L.divIcon({className:'',html:'<div class="pin pin-esperienza">🎟️</div>',iconSize:[38,38],iconAnchor:[19,19],popupAnchor:[0,-16]})};
function popupOptions(){const mobile=window.innerWidth<=760;return {maxWidth:mobile?Math.max(260,window.innerWidth-36):380,minWidth:mobile?Math.max(260,window.innerWidth-36):260,closeButton:false,autoPanPadding:mobile?[18,18]:[24,24],className:"travel-popup"};}
const markerRecords=[];
experiences.forEach(p=>{
  const maps=`https://www.google.com/maps?q=${p.lat},${p.lon}`;
  const dayText=p.days.map(d=>'Giorno '+d).join(', ');
  const stops=p.stops.map(x=>`<li>${x}</li>`).join('');
  const popup=`<div class="popup"><button class="popup-close" type="button" aria-label="Chiudi">×</button><div class="popup-body"><div class="experience-type">${p.kind}</div><h3>${p.name}</h3>${photoHtml(p.name,p)}<p><b>${dayText}</b>${p.duration?` · ${p.duration}`:''}</p><p>${p.summary}</p><ul class="experience-list">${stops}</ul>${p.note?`<div class="experience-note"><b>Nota:</b> ${p.note}</div>`:''}<a href="${maps}" target="_blank" rel="noopener">Apri il punto in Google Maps</a></div></div>`;
  const m=L.marker([p.lat,p.lon],{icon:icons.esperienza,zIndexOffset:500}).bindPopup(popup,popupOptions());
  m.bindTooltip(p.name,{permanent:false,direction:'top',className:'label'});
  markerRecords.push({marker:m,p});
});
points.forEach(p=>{const maps=`https://www.google.com/maps?q=${p.lat},${p.lon}`;const dayText=p.days?.length?p.days.map(d=>'Giorno '+d).join(', '):'Punto di riferimento';const desc=(p.description||'').replace(/<br\s*\/?>/gi,' · ');const popup=`<div class="popup"><button class="popup-close" type="button" aria-label="Chiudi">×</button><div class="popup-body"><h3>${p.name}</h3>${p.category==='hotel'?'':photoHtml(p.name,p)}<p><b>${dayText}</b></p>${desc?`<p>${desc}</p>`:''}${p.name==='Manila'?'<div class="personal-photo-block" data-personal-album="manila"><div class="photo-gallery-status">Caricamento delle nostre foto…</div></div>':p.name==='Coron'?'<div class="personal-photo-block" data-personal-album="coron"><div class="photo-gallery-status">Caricamento delle nostre foto…</div></div>':''}<a href="${maps}" target="_blank" rel="noopener">Apri in Google Maps</a></div></div>`;const m=L.marker([p.lat,p.lon],{icon:icons[p.category]}).bindPopup(popup,popupOptions());if(!['aeroporto','porto'].includes(p.category))m.bindTooltip(p.name,{permanent:false,direction:'top',className:'label'});markerRecords.push({marker:m,p});});
const routeRecords=[];routes.forEach(r=>{let style={weight:4,opacity:.82};if(r.type==='Volo')Object.assign(style,{color:'#6a1b9a',dashArray:'9 8'});else if(r.type==='Traghetto')Object.assign(style,{color:'#0277bd',dashArray:'4 7'});else Object.assign(style,{color:'#555'});const line=L.polyline([r.from,r.to],style).bindTooltip(r.name);routeRecords.push({line,r});});
function renderItinerary(selected){const box=document.getElementById('itinerary');box.innerHTML='';itinerary.filter(x=>selected==='all'||x.day===Number(selected)).forEach(x=>{const el=document.createElement('div');el.className='day-card '+(selected!=='all'?'active':'');const expCount=experiences.filter(e=>e.days.includes(x.day)).length;el.innerHTML=`<div class="day-title">Giorno ${x.day} · ${x.title}</div><div class="date">${x.date}</div>${x.hotel?`<div class="badge">🏨 ${x.hotel}</div>`:''}${expCount?`<div class="badge">🎟️ ${expCount} ${expCount===1?'esperienza':'esperienze'}</div>`:''}<p class="small">${x.activity}</p>${x.notes?`<p class="small"><b>Nota:</b> ${x.notes}</p>`:''}`;box.appendChild(el);});}
function refresh(){const selected=document.getElementById('daySelect').value;const cats=new Set([...document.querySelectorAll('[data-cat]:checked')].map(x=>x.dataset.cat));markerRecords.forEach(({marker,p})=>{const dayOk=selected==='all'||(p.days||[]).includes(Number(selected));const show=cats.has(p.category)&&dayOk;if(show&&!map.hasLayer(marker))marker.addTo(map);if(!show&&map.hasLayer(marker))map.removeLayer(marker);});routeRecords.forEach(({line,r})=>{const show=selected==='all'||r.days.includes(Number(selected));if(show&&!map.hasLayer(line))line.addTo(map);if(!show&&map.hasLayer(line))map.removeLayer(line);});renderItinerary(selected);const visible=[];markerRecords.forEach(({marker})=>{if(map.hasLayer(marker))visible.push(marker.getLatLng());});if(visible.length)map.fitBounds(L.latLngBounds(visible),{padding:[35,35],maxZoom:selected==='all'?5:11});}

document.getElementById('daySelect').addEventListener('change',refresh);document.querySelectorAll('[data-cat]').forEach(x=>x.addEventListener('change',refresh));document.getElementById('mapStyleSelect').addEventListener('change',e=>setBaseLayer(e.target.value));

const legendControl=L.control({position:'bottomright'});legendControl.onAdd=()=>{const wrap=L.DomUtil.create('div','legend-control');const btn=L.DomUtil.create('button','legend-button',wrap);btn.type='button';btn.textContent='Legenda';btn.setAttribute('aria-expanded','false');const panel=L.DomUtil.create('div','legend-panel',wrap);panel.innerHTML='<button type="button" class="legend-close" aria-label="Chiudi legenda">×</button><b>Categorie</b><br>✈️ Aeroporto<br>⛴️ Porto<br>🏨 Hotel<br>📍 Luogo<br>🎟️ Esperienza<br><br><b>Percorsi</b><br><span style="border-color:#6a1b9a;border-top-style:dashed"></span>Volo<br><span style="border-color:#0277bd;border-top-style:dashed"></span>Traghetto<br><span style="border-color:#555"></span>Terra';L.DomEvent.disableClickPropagation(wrap);const close=()=>{panel.classList.remove('open');btn.setAttribute('aria-expanded','false')};btn.addEventListener('click',()=>{const open=panel.classList.toggle('open');btn.setAttribute('aria-expanded',String(open))});panel.querySelector('.legend-close').addEventListener('click',close);map.on('click',close);return wrap;};legendControl.addTo(map);refresh();
