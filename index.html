function regionFor(name,p={}){const n=(name||'').toLowerCase();if(n.includes('milano')||n.includes('malpensa'))return 'milano';if(n.includes('delhi')||n.includes('indira gandhi'))return 'delhi';if(n.includes('manila')||n.includes('ninoy')||n.includes('golden phoenix')||n.includes('clark'))return 'manila';if(n.includes('coron')||n.includes('kayangan')||n.includes('francisco b. reyes'))return 'coron';if(n.includes('el nido')||n.includes('nacpan')||n.includes('matinloc')||n.includes('big lagoon')||n.includes('hidden beach'))return 'elnido';if(n.includes('bohol')||n.includes('panglao')||n.includes('balicasag')||n.includes('chocolate'))return 'bohol';if(n.includes('oslob')||n.includes('tumalog')||n.includes('sumilon')||n.includes('inambakan'))return 'oslob';if(n.includes('siquijor')||n.includes('cambugahay'))return 'siquijor';if(n.includes('dumaguete'))return 'dumaguete';if((p.lat||0)>11.3&&(p.lat||0)<12.5)return 'coron';if((p.lat||0)>10.7&&(p.lat||0)<11.5)return 'elnido';if((p.lat||0)>9.3&&(p.lat||0)<10.3&&(p.lon||0)>123.6)return 'bohol';if((p.lat||0)>8.8&&(p.lat||0)<9.5)return 'siquijor';return 'manila';}
function photoHtml(name,p){const exact=photos[name];const ph=exact||regionalPhotos[regionFor(name,p)];const fallback=regionalPhotos.manila.url;const caption=exact?'Foto del luogo':ph.label;return `<img class="popup-photo" src="${ph.url}" data-fallback="${fallback}" alt="${ph.alt}" loading="lazy" onerror="if(!this.dataset.usedFallback){this.dataset.usedFallback='1';this.src=this.dataset.fallback}else{this.style.display='none';this.nextElementSibling.style.display='block'}"><div class="photo-fallback">Foto non disponibile</div><div class="photo-credit">${caption}: <a href="${ph.credit}" target="_blank" rel="noopener">Wikimedia Commons</a></div>`;}

points.forEach(p=>{const maps=`https://www.google.com/maps?q=${p.lat},${p.lon}`;const dayText=p.days?.length?p.days.map(d=>'Giorno '+d).join(', '):'Punto di riferimento';const desc=(p.description||'').replace(/<br\s*\/?>/gi,' · ');const popup=`<div class="popup"><h3>${p.name}</h3>${photoHtml(p.name,p)}<p><b>${dayText}</b></p>${desc?`<p>${desc}</p>`:''}<a href="${maps}" target="_blank" rel="noopener">Apri in Google Maps</a></div>`;const m=L.marker([p.lat,p.lon],{icon:icons[p.category]}).bindPopup(popup,{maxWidth:340});if(!['aeroporto','porto'].includes(p.category))m.bindTooltip(p.name,{permanent:false,direction:'top',className:'label'});markerRecords.push({marker:m,p});});

function renderItinerary(selected){const box=document.getElementById('itinerary');box.innerHTML='';itinerary.filter(x=>selected==='all'||x.day===Number(selected)).forEach(x=>{const el=document.createElement('div');el.className='day-card '+(selected!=='all'?'active':'');const expCount=experiences.filter(e=>e.days.includes(x.day)).length;el.innerHTML=`<div class="day-title">Giorno ${x.day} · ${x.title}</div><div class="date">${x.date}</div>${x.hotel?`<div class="badge">🏨 ${x.hotel}</div>`:''}${expCount?`<div class="badge">🎟️ ${expCount} ${expCount===1?'esperienza':'esperienze'}</div>`:''}<p class="small">${x.activity}</p>${x.notes?`<p class="small"><b>Nota:</b> ${x.notes}</p>`:''}`;box.appendChild(el);});}
function refresh(){const selected=document.getElementById('daySelect').value;updateDayQuick(selected);const cats=new Set([...document.querySelectorAll('[data-cat]:checked')].map(x=>x.dataset.cat));markerRecords.forEach(({marker,p})=>{const dayOk=selected==='all'||(p.days||[]).includes(Number(selected));const show=cats.has(p.category)&&dayOk;if(show&&!map.hasLayer(marker))marker.addTo(map);if(!show&&map.hasLayer(marker))map.removeLayer(marker);});routeRecords.forEach(({line,r})=>{const show=selected==='all'||r.days.includes(Number(selected));if(show&&!map.hasLayer(line))line.addTo(map);if(!show&&map.hasLayer(line))map.removeLayer(line);});renderItinerary(selected);const visible=[];markerRecords.forEach(({marker})=>{if(map.hasLayer(marker))visible.push(marker.getLatLng());});if(visible.length)map.fitBounds(L.latLngBounds(visible),{padding:[35,35],maxZoom:selected==='all'?5:11});}
function buildDayQuick(){const wrap=document.getElementById('dayQuick');for(let d=1;d<=20;d++){const b=document.createElement('button');b.type='button';b.textContent=d;b.dataset.day=String(d);b.title=`Mostra il giorno ${d}`;b.addEventListener('click',()=>{document.getElementById('daySelect').value=String(d);refresh();});wrap.appendChild(b);}}
function updateDayQuick(selected){document.querySelectorAll('#dayQuick button').forEach(b=>b.classList.toggle('active',b.dataset.day===selected));document.getElementById('dayStatus').textContent=selected==='all'?'Tutto il viaggio':`Visualizzazione: giorno ${selected}`;}
